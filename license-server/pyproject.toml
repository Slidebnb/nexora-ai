[project]
name = "nexora-license-server"
version = "0.1.0"
description = "NEXORA AI – Lizenz- und Abrechnungsdienst (Prototyp, Stripe)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
