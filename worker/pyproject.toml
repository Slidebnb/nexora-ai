[project]
name = "nexora-worker"
version = "0.1.0"
description = "NEXORA AI – lokaler Worker (nur 127.0.0.1)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",  # browser-use 0.13.14 verlangt genau diese Version
  "httpx==0.28.1",
  "pypdf==6.21.4",  # BSD-3-Clause; Sicherheitsupdate (pip-audit: 26 Meldungen in 6.16.2)
  "pypdfium2==5.14.0",  # BSD-3-Clause/Apache-2.0 – PDF-Seiten als Bild für die optionale Texterkennung
  "pillow==13.0.0",  # MIT-CMU; Sicherheitsupdate (pip-audit: 39 Meldungen in 12.3.0)
  "websockets==15.0.1",  # browser-use (über cdp-use) verlangt diese Version
  # Desktop-Bedienung über Windows UI Automation (BSD-3-Clause); nur unter Windows
  "pywinauto==0.6.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
# KI-Browser (Masterplan: nur nach expliziter Aktivierung) – `uv sync --extra browser`
browser = ["browser-use==0.13.14"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
]
# Installer-Build des Sidecars (GPL mit Bootloader-Ausnahme: erzeugte Programme frei lizenzierbar)
build = [
  "pyinstaller==6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
# Sicherheitsupdates auch dort erzwingen, wo browser-use ältere Versionen fest vorgibt (Audit 2026-10-31)
override-dependencies = [
  "pypdf==6.21.4",
  "pillow==13.0.0",
  "anyio==4.14.2",
  "mcp==2.3.0",
]
