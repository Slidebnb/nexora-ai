[project]
name = "nexora-worker"
version = "0.1.0"
description = "NEXORA AI – lokaler Worker (nur 127.0.0.1)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "websockets==17.4",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
